  title: "Distinguished Professor"
  abstract: "<b>The End of Anonymity in Genomics: Rethinking Privacy, Sharing, and Trust</b><br><p>Abstract: Genomic research is built on the premise that data can be shared safely, yet advances in machine learning are beginning to erode this foundation. In this talk, I examine how modern models can memorize and expose sensitive genomic information, enabling membership inference and related attacks even in high-dimensional biological settings. I argue that privacy in genomics is fundamentally relational, since shared ancestry allows information about one individual to reveal information about others, complicating standard notions of anonymization and consent. I will also discuss the limits of synthetic genomic data as a privacy solution, showing how generative models can reproduce fine-grained population structure and rare variation.</p><br><p>At the same time, I will present emerging approaches for enabling collaborative genomic studies under realistic privacy constraints, including a sandbox framework for genome-wide association studies that combines technical advances with policy-aligned risk assessment to support IRB decision-making and broaden access to data. These developments suggest that anonymity in genomics is not a guarantee but an assumption that must be reconsidered, with significant implications for how collaborative genomic studies are designed and governed in the future.</p>"
  bio: "<b>Bio:</b> Jaideep Vaidya is a Distinguished Professor of Computer Information Systems and Vice Dean for Faculty Affairs and Research at Rutgers University, the Director of the Rutgers Institute for Data Science, Learning, and Applications. He received the B.E. degree in Computer Engineering from the University of Mumbai, the M.S. and Ph.D. degree in Computer Science from Purdue University. His general area of research is at the intersection of security, privacy, data mining, data management, and artificial intelligence. He has published over 200 technical papers in peer-reviewed journals and conference proceedings, and has received best paper awards from the premier conferences in data mining, databases, digital government, security, and informatics. He is a Fellow of the AAAS, ACMI, AIMBE, IAHSI, IEEE, and IFIP as well as an ACM Distinguished Scientist."
