  title: "Research Director"
  abstract: "<b>Federated Learning in Healthcare: From Theory to Practice</b><br><p>Abstract: Is federated learning (FL) ready to move from academic experiment to clinical infrastructure? While FL enables collaborative machine learning across institutions without sharing raw patient data, translating this approach into clinical practice requires navigating complex technical regulatory and governance challenges. In this talk I presented the project Fed-BioMed in which we aim at providing the technical foundations for translating FL into real-world healthcare applications. Fed-BioMed is an open-source healthcare-first FL framework designed to support the deployment of FL across real multi-hospital consortia spanning domains from oncology to neurology and cardiac imaging. Healthcare-first means that security governance and regulatory compliance are engineered into the system from the ground up. Beyond infrastructure the Fed-BioMed platform provides a unique testbed for innovative research as demonstrated by recent advances in federated data harmonization and machine unlearning. Our vision is an open interdisciplinary ecosystem for medical AI governed transparently and built collaboratively across academia healthcare and industry.</p>"
  bio: "Marco Lorenzi is Research Director (DR) in the EPIONE team at Inria Sophia Antipolis and Université Côte d’Azur. Prior to this position, he held an affiliate appointment within the School of Biomedical Engineering & Imaging Sciences at King's College London as Visiting Senior Lecturer, served as Research Associate in the Centre for Medical Image Computing at University College London, and worked as a Researcher at the Hospital San Giovanni di Dio Fatebenefratelli in Italy. His research focuses on statistical learning methods for modeling heterogeneous data in biomedical applications. Together with his team, he develops approaches to model disease progression from multimodal biomedical data in order to support clinical decision-making and simulate intervention strategies. His work also addresses the analysis of multi-centric biomedical information, with a particular emphasis on developing methods and software for collaborative learning in healthcare applications."
